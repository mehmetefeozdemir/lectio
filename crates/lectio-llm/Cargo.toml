[package]
name = "lectio-llm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lectio's local study model: Qwen2.5-Instruct (GGUF) on candle, shared by the desktop app and the browser worker (ADR-021)."

[dependencies]
lectio-core = { path = "../lectio-core" }
# Reuses the download catalogue types and the streaming SHA-256 check (ADR-016).
lectio-speech = { path = "../lectio-speech" }
candle-core = "0.11"
candle-transformers = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pure-Rust regular expressions only (the default `onig` feature compiles C).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["accelerate"] }
candle-transformers = { version = "0.11", features = ["accelerate"] }
