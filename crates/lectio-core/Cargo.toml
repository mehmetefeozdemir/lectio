[package]
name = "lectio-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lectio domain model: courses, sessions, timestamped notes, labels, recording clock and seek logic. No UI, no audio I/O."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# In the browser there is no OS random-number source, so uuid's v4 ids get
# their randomness from `crypto.getRandomValues` via the `js` feature (P-007).
# The code stays the same on every platform.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["v4", "serde", "js"] }

[dev-dependencies]
tempfile = "3"
