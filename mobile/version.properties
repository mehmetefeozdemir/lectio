# The one place for the mobile apps' version (ADR-036). Read by the Android
# build (versionName, versionCode) and by tools/mobile/build-ios.sh (iOS
# CFBundleShortVersionString, CFBundleVersion).
version=1.0.0
# The store build number, shared by both stores. Add one for every build you
# upload to either store; never lower it or reuse it (the stores refuse a
# build number they have already seen).
build=1
