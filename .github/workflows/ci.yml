# Lectio CI (ADR-010): every push builds and tests on Windows, macOS and
# Linux, and builds the web (WebAssembly) version.
#

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: .
jobs:
  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # cpal needs the ALSA headers; egui/winit need xkbcommon, Wayland and
      # the X11/XCB libraries to compile their Linux backends. Phase 3: the
      # screenshot library (xcap) binds to PipeWire/SPA via bindgen (clang).
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev clang libdbus-1-dev \
            libgbm-dev libegl1-mesa-dev libdrm-dev \
            xvfb mesa-vulkan-drivers libgl1-mesa-dri pulseaudio pulseaudio-utils

      - name: Build
        run: cargo build --workspace --locked

      - name: Test (data model, seek logic, capture pipeline, storage, CLI)
        run: cargo test --workspace --locked

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Phase 4b (ADR-028): proof on desktops I can't test by hand. The app's
      # --screenshot mode opens the window on the sample data, draws it and
      # saves a PNG. Linux draws under a virtual X display (Xvfb) with Mesa's
      # software renderer; Windows runners have the WARP software adapter.
      # Advisory until they have been green a few times.
      - name: Desktop screenshots
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p shots/ci
          run() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a -s "-screen 0 1400x900x24" "$@"
            else
              "$@"
            fi
          }
          bin=target/debug/lectio
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          run "$bin" --screenshot "shots/ci/$os-workspace.png"
          LECTIO_START=paper run "$bin" --screenshot "shots/ci/$os-paper.png"
          LECTIO_START=collections run "$bin" --screenshot "shots/ci/$os-collections.png"
          LECTIO_ZOOM=2 LECTIO_START=home run "$bin" --screenshot "shots/ci/$os-home-200.png"
          ls -la shots/ci

      # A headless audio check where the runner allows it: Linux gets a
      # PulseAudio "null sink", whose monitor is a silent microphone, and the
      # app records from it for 2 seconds (--self-test-audio checks the WAV).
      - name: Audio self-test (Linux, PulseAudio null sink)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=lectio_ci
          pactl set-default-source lectio_ci.monitor
          target/debug/lectio --self-test-audio 2

      - name: Upload the desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots-${{ matrix.os }}
          path: shots/ci/*.png
          if-no-files-found: ignore

  web:
    name: web (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: lectio-core compiles for the browser
        run: cargo check -p lectio-core --target wasm32-unknown-unknown --locked

      - name: The whole app compiles for the browser
        run: cargo check --target wasm32-unknown-unknown --locked

      - name: Lint (web, including the speech engine and its worker)
        run: cargo clippy --workspace --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build the web app (trunk)
        run: trunk build --release

      - name: Upload the web build
        uses: actions/upload-artifact@v4
        with:
          name: lectio-web
          path: dist
          if-no-files-found: error

      # Phase 2 browser flow (tools/web-smoke.mjs --flow phase2): import a PDF,
      # record, note, sketch, fake-camera photo, reload, check IndexedDB.
      # Controls are found by accessible name (`#test` in the URL, PROBLEMS
      # P-017, P-020). Advisory until it has been green on CI for a few runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # built-in WebSocket, used by the script

      - name: Browser smoke test (Phase 2 flow, headless Chrome)
        continue-on-error: true
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist &
          sleep 1
          CHROME="$(command -v google-chrome)" node tools/web-smoke.mjs "http://127.0.0.1:8765/index.html#test" --flow phase2

      # Phase 4b (ADR-027): screen readers. The names of controls, sessions,
      # headings and formulas must be in Chrome's accessibility tree, activating
      # them must drive the app, and Tab must reach the controls in order.
      - name: Screen-reader and keyboard check (headless Chrome)
        continue-on-error: true
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory dist &
          sleep 1
          CHROME="$(command -v google-chrome)" node tools/web-smoke.mjs "http://127.0.0.1:8766/index.html#sample#test" --flow a11y

      - name: Upload the browser smoke-test screenshots and exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-screenshots
          path: |
            shots/web-flow-*.png
            shots/phase4b-web-*.png
            target/web-downloads/*
          if-no-files-found: ignore

  # Phase 5a (ADR-029): the UniFFI surface must also produce Kotlin, so the
  # Android app (5b) can start from bindings that are known to generate.
  kotlin-bindings:
    name: Kotlin bindings (check for Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build lectio-ffi as a shared library
        run: cargo rustc -p lectio-ffi --lib --crate-type cdylib --locked

      - name: Generate the Kotlin bindings
        run: |
          cargo run -p lectio-ffi --bin uniffi-bindgen --locked -- \
            generate --library target/debug/liblectio_ffi.so --language kotlin --no-format --out-dir target/kotlin
          file=$(find target/kotlin -name '*.kt' | head -n 1)
          test -s "$file"
          grep -q "class LectioLibrary" "$file"
          echo "Generated $file ($(wc -l < "$file") lines)"

      - name: Upload the Kotlin bindings
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-bindings
          path: target/kotlin
          if-no-files-found: error

  # Phase 5a (ADR-029, ADR-030): the iOS app. Builds the XCFramework (device
  # arm64, Simulator arm64 + x86_64) and the Swift bindings, generates the
  # Xcode project, runs the XCTests and the UI test on a Simulator, and keeps
  # the UI test's screenshots.
  ios:
    name: iOS (Simulator)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build the XCFramework, bindings and Xcode project
        run: tools/mobile/build-ios.sh

      - name: Pick an iPhone Simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, list_ in devices.items() if "iOS" in runtime for d in list_ if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Unit tests and the UI test
        working-directory: app/mobile/ios
        run: |
          xcodebuild test -project Lectio.xcodeproj -scheme Lectio \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult

      - name: Export the Simulator screenshots
        if: always()
        working-directory: app/mobile/ios
        run: |
          mkdir -p build/screenshots
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
          fi
          ls -la build/screenshots

      - name: Upload the Simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: mobile/ios/build/screenshots
          if-no-files-found: ignore
